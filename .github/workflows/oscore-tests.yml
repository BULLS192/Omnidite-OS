name: OS Core tests
on:
  push:
    branches:
      - 'feature/os-core-modular-v0.2'
  pull_request:
    paths:
      - 'oskit/**'
      - '.github/workflows/oscore-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test oskit/tests/*.test.mjs
